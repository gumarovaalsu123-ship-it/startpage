<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>start</title>
<style>
  :root {
    --bg: #0a0a0c;
    --pink: #ff4fa3;
    --pink-soft: #ff8cc6;
    --silver: #d7d9e0;
    --silver-dim: #8b8e99;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-strong: rgba(255, 255, 255, 0.1);
    --stroke: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--silver);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: 0.55; z-index: 0;
    animation: float 18s ease-in-out infinite alternate;
  }
  .b1 { width: 460px; height: 460px; background: var(--pink); top: -120px; left: -100px; }
  .b2 { width: 380px; height: 380px; background: #7a1d52; bottom: -140px; right: -60px; animation-delay: -6s; }
  .b3 { width: 260px; height: 260px; background: #b8bcc8; opacity: 0.18; top: 40%; left: 60%; animation-delay: -11s; }
  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.12); }
  }

  body::after {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  main {
    position: relative; z-index: 2;
    width: min(680px, 90vw);
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }

  .clock {
    font-size: clamp(64px, 11vw, 112px);
    font-weight: 200; letter-spacing: -2px; line-height: 1;
    background: linear-gradient(180deg, #fff 0%, var(--silver) 45%, var(--pink-soft) 130%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .date { color: var(--silver-dim); font-size: 15px; letter-spacing: 3px; margin-top: -14px; }

  /* поиск */
  .search-wrap { width: 100%; position: relative; }
  .search {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px 6px 22px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 999px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  .search:focus-within {
    border-color: var(--pink);
    background: var(--glass-strong);
    box-shadow: 0 0 0 4px rgba(255, 79, 163, 0.14), 0 10px 40px rgba(255, 79, 163, 0.18);
  }
  .search input {
    flex: 1; background: none; border: none; outline: none;
    color: #fff; font-size: 17px; padding: 12px 0; font-family: inherit;
  }
  .search input::placeholder { color: var(--silver-dim); }
  .search button {
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--pink), #c2307a);
    border: none; color: #fff; cursor: pointer;
    width: 44px; height: 44px; border-radius: 50%;
    transition: transform .2s, filter .2s;
  }
  .search button:hover { transform: scale(1.08); filter: brightness(1.15); }
  .search button svg { width: 20px; height: 20px; }

  /* подсказки */
  .suggest {
    position: absolute; left: 12px; right: 12px; top: calc(100% + 8px);
    background: rgba(18, 14, 18, 0.72);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    padding: 8px; list-style: none;
    display: none; z-index: 10;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .suggest.open { display: block; }
  .suggest li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 14px;
    cursor: pointer; font-size: 16px; color: var(--silver);
  }
  .suggest li svg { width: 16px; height: 16px; flex: none; opacity: .5; }
  .suggest li:hover, .suggest li.active { background: rgba(255, 79, 163, 0.16); color: #fff; }

  /* ссылки */
  .links {
    width: 100%;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px;
  }
  .links a {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 18px 10px;
    text-decoration: none; color: var(--silver); font-size: 14px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 20px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    transition: transform .25s, border-color .25s, background .25s, box-shadow .25s;
  }
  .links a:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 79, 163, 0.6);
    background: var(--glass-strong);
    box-shadow: 0 12px 30px rgba(255, 79, 163, 0.16);
  }
  .links .ico { font-size: 22px; }

  .hello { color: var(--silver-dim); font-size: 13px; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main>
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date"></div>

    <div class="search-wrap">
      <form class="search" id="form" action="https://www.google.com/search" method="get">
        <input id="q" name="q" type="text" placeholder="поиск..." autocomplete="off" autofocus>
        <button type="submit" aria-label="Найти">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>
          </svg>
        </button>
      </form>
      <ul class="suggest" id="suggest"></ul>
    </div>

    <!-- ссылки меняй тут: иконка, название, адрес -->
    <nav class="links" id="links"></nav>

    <div class="hello" id="hello"></div>
  </main>

<script>
  /* ссылки */
  const LINKS = [
    { ico: "✦", name: "github",    url: "https://github.com" },
    { ico: "▶", name: "youtube",   url: "https://youtube.com" },
    { ico: "✉", name: "почта",     url: "https://mail.google.com" },
    { ico: "♪", name: "музыка",    url: "https://music.youtube.com" },
    { ico: "❀", name: "pinterest", url: "https://pinterest.com" },
    { ico: "◈", name: "figma",     url: "https://figma.com" }
  ];
  document.getElementById("links").innerHTML = LINKS.map(l =>
    `<a href="${l.url}"><span class="ico">${l.ico}</span>${l.name}</a>`
  ).join("");

  /* часы */
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const d = new Date(), h = d.getHours();
    document.getElementById("clock").textContent = pad(h) + ":" + pad(d.getMinutes());
    document.getElementById("date").textContent =
      d.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
    document.getElementById("hello").textContent =
      h < 5 ? "доброй ночи" : h < 12 ? "доброе утро" : h < 18 ? "добрый день" : "добрый вечер";
  }
  tick(); setInterval(tick, 10000);

  /* подсказки гугла */
  const q = document.getElementById("q");
  const box = document.getElementById("suggest");
  const form = document.getElementById("form");
  const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>';
  let items = [], idx = -1, timer, reqId = 0;

  function render() {
    box.innerHTML = items.map((t, i) =>
      `<li class="${i === idx ? "active" : ""}" data-i="${i}">${ICON}<span></span></li>`).join("");
    box.querySelectorAll("li span").forEach((s, i) => s.textContent = items[i]);
    box.classList.toggle("open", items.length > 0);
  }
  function go(text) { q.value = text; form.submit(); }

  async function fetchSuggest(text) {
    const id = ++reqId;
    try {
      const r = await fetch("https://suggestqueries.google.com/complete/search?client=firefox&hl=ru&q=" + encodeURIComponent(text));
      const data = await r.json();
      if (id !== reqId) return;
      items = (data[1] || []).slice(0, 7); idx = -1; render();
    } catch (e) { items = []; render(); }
  }

  q.addEventListener("input", () => {
    clearTimeout(timer);
    const v = q.value.trim();
    if (!v) { items = []; render(); return; }
    timer = setTimeout(() => fetchSuggest(v), 150);
  });
  q.addEventListener("keydown", e => {
    if (!items.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); idx = (idx + 1) % items.length; render(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; render(); }
    else if (e.key === "Enter" && idx >= 0) { e.preventDefault(); go(items[idx]); }
    else if (e.key === "Escape") { items = []; render(); }
  });
  box.addEventListener("mousedown", e => {
    const li = e.target.closest("li");
    if (li) go(items[+li.dataset.i]);
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".search-wrap")) { items = []; render(); }
  });
</script>
</body>
</html>
